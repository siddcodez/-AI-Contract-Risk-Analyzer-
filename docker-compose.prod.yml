version: "3.9"

# =============================================================================
# ContractIQ Production-Grade Multi-Service Stack
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # 1. PostgreSQL with pgvector extension
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: contractiq_prod_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contract_risk_db}
      POSTGRES_USER: ${POSTGRES_USER:-contract_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contract_pass}
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contract_user} -d ${POSTGRES_DB:-contract_risk_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  # ---------------------------------------------------------------------------
  # 2. Redis Message Broker & State Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: contractiq_prod_redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - prod_redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ---------------------------------------------------------------------------
  # 3. Backend API Gateway (FastAPI)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: contractiq_prod_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://app_user:app_pass@postgres:5432/contract_risk_db
      MIGRATION_DATABASE_URL: postgresql+asyncpg://contract_user:contract_pass@postgres:5432/contract_risk_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  # ---------------------------------------------------------------------------
  # 4. Celery Worker (Async pipeline & LLM tasks)
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: contractiq_prod_worker
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://app_user:app_pass@postgres:5432/contract_risk_db
      MIGRATION_DATABASE_URL: postgresql+asyncpg://contract_user:contract_pass@postgres:5432/contract_risk_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  # ---------------------------------------------------------------------------
  # 5. Next.js Frontend Dashboard
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: contractiq_prod_frontend
    restart: always
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:8000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M

volumes:
  prod_postgres_data:
  prod_redis_data:
  prod_minio_data:
