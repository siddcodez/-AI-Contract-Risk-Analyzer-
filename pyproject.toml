[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-contract-risk-analyzer"
version = "0.1.0"
description = "AI-powered multi-tenant contract risk analysis platform"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",

    # Config & validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # Redis / Celery
    "redis[hiredis]>=5.2.0",
    "celery[redis]>=5.4.0",

    # Object storage
    "boto3>=1.35.0",
    "aiobotocore>=2.15.0",

    # Logging
    "structlog>=24.4.0",

    # HTTP client (health checks + LLM calls later)
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff==0.16.2",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    # Type stubs
    "types-boto3>=1.35.0",
    "boto3-stubs[s3]>=1.35.0",
]

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests", "scripts"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "S",   # flake8-bandit (security)
    "T20", # flake8-print (no stray print())
    "RUF", # ruff-specific rules
]
ignore = [
    "S101",  # use of assert — needed in tests
    "B008",  # function call in default arg — FastAPI Depends() pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]
"scripts/**" = ["T20"]  # scripts may print

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = false
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["celery.*", "asyncpg.*", "aiobotocore.*", "boto3.*", "botocore.*", "redis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=65"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/workers/celery_app.py"]  # Celery wiring is integration-tested, not unit-tested

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scripts*"]
