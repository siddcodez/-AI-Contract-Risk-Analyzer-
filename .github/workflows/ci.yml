name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"

jobs:

  # ---------------------------------------------------------------------------
  # Job 1: Lint & Format
  # ---------------------------------------------------------------------------

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff==0.16.2

      - name: Ruff — lint
        run: ruff check app tests scripts

      - name: Ruff — format check
        run: ruff format --check app tests scripts


  # ---------------------------------------------------------------------------
  # Job 2: Type Check
  # ---------------------------------------------------------------------------

  typecheck:
    name: Type Check (mypy --strict)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: mypy
        run: mypy --strict app/


  # ---------------------------------------------------------------------------
  # Job 3: Test Suite
  # ---------------------------------------------------------------------------

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest

    services:

      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: contract_risk_db
          POSTGRES_USER: contract_user
          POSTGRES_PASSWORD: contract_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contract_user -d contract_risk_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        command: server /data --console-address ":9001"
        ports:
          - 9000:9000
          - 9001:9001
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://app_user:app_pass@localhost:5432/contract_risk_db
      MIGRATION_DATABASE_URL: postgresql+asyncpg://contract_user:contract_pass@localhost:5432/contract_risk_db
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2

      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: contract-documents
      MINIO_USE_SSL: "False"

      SECRET_KEY: ci-test-secret-key-not-for-production-x
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
      APP_VERSION: "0.1.0"

      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Create app_user database role
        run: |
          PGPASSWORD=contract_pass psql -h localhost -U contract_user -d contract_risk_db <<'SQL'
            DO $$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'app_user') THEN
                CREATE ROLE app_user WITH LOGIN PASSWORD 'app_pass' NOSUPERUSER NOBYPASSRLS;
              END IF;
            END
            $$;
            GRANT CONNECT ON DATABASE contract_risk_db TO app_user;
            GRANT USAGE ON SCHEMA public TO app_user;
            ALTER DEFAULT PRIVILEGES FOR ROLE contract_user IN SCHEMA public
              GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO app_user;
            ALTER DEFAULT PRIVILEGES FOR ROLE contract_user IN SCHEMA public
              GRANT USAGE, SELECT ON SEQUENCES TO app_user;
            ALTER DEFAULT PRIVILEGES FOR ROLE contract_user IN SCHEMA public
              GRANT EXECUTE ON FUNCTIONS TO app_user;
          SQL

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest tests/ -v --cov=app --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false


  # ---------------------------------------------------------------------------
  # Job 4: Frontend Checks
  # ---------------------------------------------------------------------------

  frontend:
    name: Frontend (tsc, lint, build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Next.js production build
        working-directory: frontend
        run: npm run build